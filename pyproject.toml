[project]
name = "skypro-store-homework"
version = "0.1.0"
description = "Core domain models for a simple e-commerce store"
readme = "README.md"
authors = [
    {name = "Максим Магазейщиков",email = "maxan43@yandex.ru"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=75"

[tool.coverage.run]
branch = true
relative_files = true
source = ["src"]

[tool.coverage.report]
fail_under = 75
precision = 2
show_missing = true

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true
